<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشوارك • واجهة الكابتن</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #0f172a;
  color: #f8fafc;
  margin: 0;
  padding: 20px;
}
.card {
  background-color: #1e293b;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 15px;
}
h1, h2 {
  margin-top: 0;
  color: #00e676;
}
.btn {
  display: inline-block;
  padding: 10px 16px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  border: none;
  cursor: pointer;
  margin-top: 8px;
}
.btn-accept {
  background-color: #00e676;
  color: #000000;
}
.btn-back {
  background-color: #334155;
  color: #ffffff;
}
</style>
</head>
<body>
  <div class="card">
    <h1>واجهة الكابتن</h1>
    <p>استقبال الطلبات وإدارة حالة المشوار</p>
    <a href="index.html" class="btn btn-back">رجوع للبوابة الرئيسية</a>
  </div>

  <div class="card">
    <h2>الطلبات المتاحة حالياً</h2>
    <p>مثال طلب: من مدينة الزهور - البساتين إلى المعادي • الأجرة المقترحة: 90 جنيه</p>
    <button class="btn btn-accept" onclick="alert('تم قبول الطلب بنجاح!')">قبول المشوار</button>
  </div>
</body>
</html>
