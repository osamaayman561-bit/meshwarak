<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشوارك | Meshwarak</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-dark: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
      --border: rgba(255, 255, 255, 0.09);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, #065f46, #0f172a 75%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }

    .status-badge {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.18);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 14px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .role-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .role-btn {
      padding: 11px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .role-btn.active {
      background: var(--accent);
      color: #052e16;
      border-color: transparent;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .fare-box {
      background: var(--card-2);
      border-radius: 12px;
      padding: 12px;
      margin: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: #052e16;
    }

    .btn-accept {
      background: var(--warning);
      color: #1f1300;
      margin-top: 10px;
    }

    .btn-complete {
      background: #38bdf8;
      color: #082f49;
      margin-top: 10px;
    }

    .trip-item {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .trip-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .trip-title {
      font-weight: 800;
      font-size: 15px;
    }

    .tag {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .tag-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
    }

    .tag-accepted {
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
    }

    .tag-completed {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
    }

    .meta {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .empty {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <div class="hero-top">
        <h1 class="brand">مشوارك • Meshwarak</h1>
        <span id="connStatus" class="status-badge">متصل مباشر</span>
      </div>
      <p class="subtitle">توصيل مباشر بين أهل المنطقة في القاهرة</p>
      <div class="role-switch">
        <button id="riderRoleBtn" class="role-btn active" onclick="setRole('rider')">راكب</button>
        <button id="driverRoleBtn" class="role-btn" onclick="setRole('driver')">كابتن</button>
      </div>
    </div>

    <div id="riderSection" class="card">
      <h2>اطلب مشوارك الآن</h2>
      <div class="field">
        <label>اسمك</label>
        <input id="riderName" type="text" placeholder="مثال: أسامة" />
      </div>
      <div class="grid-2">
        <div class="field">
          <label>منين؟</label>
          <input id="pickup" type="text" placeholder="البساتين - مدينة الزهور" />
        </div>
        <div class="field">
          <label>رايح فين؟</label>
          <input id="dropoff" type="text" placeholder="زهراء المعادي" />
        </div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>المسافة التقريبية (كم)</label>
          <input id="distanceKm" type="number" min="1" step="0.5" value="10" oninput="updateFarePreview()" />
        </div>
        <div class="field">
          <label>طريقة الدفع</label>
          <select id="paymentMethod">
            <option value="كاش">كاش</option>
            <option value="إنستا باي / محفظة">إنستا باي / محفظة</option>
          </select>
        </div>
      </div>

      <div class="fare-box">
        <span>الأجرة المتوقعة:</span>
        <span id="farePreview">70 ج.م</span>
      </div>

      <button class="btn btn-primary" onclick="createTrip()">تأكيد وطلب المشوار</button>
    </div>

    <div class="card">
      <h2 id="tripsHeading">المشاوير المتاحة</h2>
      <div id="tripsList"></div>
    </div>
  </div>

  <script type="module">

    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      doc,
      onSnapshot,
